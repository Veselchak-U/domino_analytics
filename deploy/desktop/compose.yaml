services:
  backend:
    image: domino-analytics-backend:local
    build:
      context: ../..
      dockerfile: deploy/backend/Dockerfile
    platform: linux/amd64
    init: true
    restart: unless-stopped
    read_only: true
    environment:
      HOST: 0.0.0.0
      PORT: "3211"
      DATABASE_PATH: /data/domino.sqlite
      DOMINO_EXAMPLES_DIR: /examples
      DOMINO_ALLOWED_ORIGINS: http://127.0.0.1:3210,http://localhost:3210
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      - backend_data:/data
      - type: bind
        source: ../../.analysis/docker-data/examples
        target: /examples
        read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 384m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3211/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  frontend:
    image: domino-analytics-frontend:local
    build:
      context: ../..
      dockerfile: deploy/frontend/Dockerfile
    platform: linux/amd64
    init: true
    restart: unless-stopped
    read_only: true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "3210"
      BACKEND_URL: http://backend:3211
      API_BASE_URL: /api/v1
    ports:
      - "127.0.0.1:3210:3210"
    mem_limit: 192m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3210/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  backend_data:
